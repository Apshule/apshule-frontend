name = "apshule-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://appshule.com"
RESEND_FROM_EMAIL = "noreply@appshule.com"
RESEND_FROM_NAME = "APSHULE"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "appshule-docs"

# Future R2 buckets (not bound): appshule-videos, appshule-recordings

[triggers]
crons = ["0 2 * * *"]

[observability]
enabled = true